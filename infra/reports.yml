AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Lab 5: Weekly report generation triggered by EventBridge / SQS,
  executed by Report Builder Lambda inside VPC, stored in S3, and delivered by
  Report Mailer Lambda via Amazon SES (sesv2).

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Project name prefix for resources.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where Aurora and Report Builder Lambda reside.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for the Report Builder Lambda.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID allowing egress to Aurora database.

  ReportsBucketName:
    Type: String
    Default: ""
    Description: Optional custom name for the reports S3 bucket (defaults to <ProjectName>-reports-<AccountId>).

  RecipientEmail:
    Type: String
    Description: Verified email address that receives the weekly reports.

  ImageUri:
    Type: String
    Description: ECR Docker image URI containing the backend and reports handler.

  RouteTableIds:
    Type: List<String>
    Default: "rtb-0a98ee50f7221eea7"
    Description: Route table IDs to associate with the S3 Gateway VPC Endpoint.

  # Database connection parameters (default to standard meetings DB)
  DbHost:
    Type: String
    Default: "localhost"
    Description: Aurora / PostgreSQL host.

  DbPort:
    Type: Number
    Default: 5432
    Description: Aurora / PostgreSQL port.

  DbName:
    Type: String
    Default: "meetings"
    Description: Aurora / PostgreSQL database name.

  DbUser:
    Type: String
    Default: "meetings"
    Description: Aurora / PostgreSQL username.

  DbPassword:
    Type: String
    Default: "meetings"
    NoEcho: true
    Description: Aurora / PostgreSQL password.

Conditions:
  HasCustomBucketName: !Not [!Equals [!Ref ReportsBucketName, ""]]

Resources:
  # =========================================================================
  # 1. S3 Storage & VPC Gateway Endpoint
  # =========================================================================
  ReportsBucket:
    Type: AWS::S3::Bucket
    # DependsOn resolves circular dependency with Mailer Lambda Permission
    DependsOn: ReportMailerPermission
    Properties:
      BucketName: !If
        - HasCustomBucketName
        - !Ref ReportsBucketName
        - !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # =========================================================================
  # 2. SQS Queue & Dead Letter Queue (DLQ)
  # =========================================================================
  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # >= 6x Lambda Timeout (6 * 60 = 360s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =========================================================================
  # 3. Report Builder Lambda (Inside VPC)
  # =========================================================================
  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-builder-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      Policies:
        - PolicyName: ReportBuilderPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
                  - "arn:aws:s3:::*/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.lambda_handler.handler"
      Role: !GetAtt ReportBuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_NULL_POOL: "true"
          REPORTS_BUCKET: !If
            - HasCustomBucketName
            - !Ref ReportsBucketName
            - !Sub "${ProjectName}-reports-${AWS::AccountId}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt ReportBuilderFunction.Arn
      BatchSize: 1
      Enabled: true

  # =========================================================================
  # 4. EventBridge Scheduler (Weekly on Monday 07:00 Kyiv time)
  # =========================================================================
  ReportSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendMessageToSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      Description: Triggers weekly report generation every Monday at 07:00 Europe/Kyiv
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt ReportSchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # =========================================================================
  # 5. SES Email Identity
  # =========================================================================
  ReportEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref RecipientEmail

  # =========================================================================
  # 6. Report Mailer Lambda (Outside VPC)
  # =========================================================================
  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-mailer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReportMailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
                  - "arn:aws:s3:::*/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage
          import boto3

          log = logging.getLogger("report-mailer")
          if not log.handlers:
              logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(name)s: %(message)s")

          def handler(event, context=None):
              records = event.get("Records", [])
              if not records:
                  log.warning("No records in event")
                  return {"statusCode": 200, "message": "No records"}

              recipient_email = os.environ.get("RECIPIENT_EMAIL", "").strip()
              sender_email = os.environ.get("SENDER_EMAIL", recipient_email).strip()

              s3 = boto3.client("s3")
              ses = boto3.client("sesv2")

              for record in records:
                  s3_data = record.get("s3", {})
                  bucket = s3_data.get("bucket", {}).get("name", "")
                  raw_key = s3_data.get("object", {}).get("key", "")
                  key = urllib.parse.unquote_plus(raw_key)

                  log.info("report-mailer triggered", extra={"trigger": "s3", "bucket": bucket, "key": key})

                  if not key.endswith(".csv"):
                      log.info("Skipping non-CSV object: %s", key)
                      continue

                  filename = os.path.basename(key)
                  response = s3.get_object(Bucket=bucket, Key=key)
                  csv_bytes = response["Body"].read()

                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly Meetings Report: {filename}"
                  msg["From"] = sender_email
                  msg["To"] = recipient_email
                  msg.set_content(
                      f"Hello,\n\nPlease find attached the weekly meetings report: {filename}.\n\n"
                      f"Generated automatically by Meetings App."
                  )
                  msg.add_attachment(
                      csv_bytes,
                      maintype="text",
                      subtype="csv",
                      filename=filename,
                  )

                  ses.send_email(
                      FromEmailAddress=sender_email,
                      Destination={"ToAddresses": [recipient_email]},
                      Content={"Raw": {"Data": msg.as_bytes()}},
                  )
                  log.info("report-mailer sent email: %s", filename, extra={"recipient": recipient_email, "file": filename})

              return {"statusCode": 200}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReportMailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  ReportsBucketName:
    Description: Name of the S3 bucket storing generated reports
    Value: !Ref ReportsBucket

  ReportRequestsQueueUrl:
    Description: URL of SQS Queue for report generation requests
    Value: !Ref ReportRequestsQueue

  ReportRequestsQueueArn:
    Description: ARN of SQS Queue for report generation requests
    Value: !GetAtt ReportRequestsQueue.Arn

  ReportRequestsDlqUrl:
    Description: URL of Dead Letter Queue (DLQ)
    Value: !Ref ReportRequestsDlq

  ReportBuilderFunctionArn:
    Description: ARN of Report Builder Lambda
    Value: !GetAtt ReportBuilderFunction.Arn

  ReportMailerFunctionArn:
    Description: ARN of Report Mailer Lambda
    Value: !GetAtt ReportMailerFunction.Arn

  WeeklyReportScheduleArn:
    Description: ARN of EventBridge Scheduler rule
    Value: !GetAtt WeeklyReportSchedule.Arn
