name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ROLE_TO_ASSUME: arn:aws:iam::334177992228:role/github-actions-deploy-role
  S3_BUCKET: meetings-frontend-334177992228
  CLOUDFRONT_DISTRIBUTION_ID: ESXCTSSJ27R0H
  ECR_REPOSITORY: meetings-backend
  ECS_CLUSTER: meetings-cluster
  ECS_SERVICE: meetings-backend-svc
  VITE_API_URL: ""

jobs:
  frontend:
    name: "Frontend: S3 + CloudFront"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334177992228:role/github-actions-deploy-role
          aws-region: eu-north-1

      - name: Fetch Cognito outputs
        id: cognito
        run: |
          POOL_ID=$(aws cloudformation describe-stacks --stack-name meetings-auth --region eu-north-1 --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text 2>/dev/null || echo "eu-north-1_2JHnz3607")
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name meetings-auth --region eu-north-1 --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text 2>/dev/null || echo "520q7rcdd0c5hf0ahk2adb8bm3")
          DOMAIN=$(aws cloudformation describe-stacks --stack-name meetings-auth --region eu-north-1 --query "Stacks[0].Outputs[?OutputKey=='AuthDomain'].OutputValue" --output text 2>/dev/null || echo "anton-meetings-2026.auth.eu-north-1.amazoncognito.com")
          AUTH_URL=$(aws cloudformation describe-stacks --stack-name meetings-auth --region eu-north-1 --query "Stacks[0].Outputs[?OutputKey=='AuthorityUrl'].OutputValue" --output text 2>/dev/null || echo "https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_2JHnz3607")
          echo "pool_id=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "auth_url=$AUTH_URL" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_COGNITO_REGION: eu-north-1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.cognito.outputs.domain }}
          VITE_COGNITO_AUTHORITY: ${{ steps.cognito.outputs.auth_url }}
          VITE_COGNITO_GOOGLE: "true"

      - name: Sync static files to S3
        run: |
          aws s3 sync dist "s3://${{ env.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query "Invalidation.Status" \
            --output text

  backend:
    name: "Backend: Docker ECR + ECS Fargate"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334177992228:role/github-actions-deploy-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f back/Dockerfile back/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update ECS service (force new deployment)
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --query "service.deployments[0].status" \
            --output text
